name: Feature idea
description: Suggest something new for Tabscape.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature, and what it would help you do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
  - type: checkboxes
    id: help
    attributes:
      label: Want to build it?
      options:
        - label: I'd like to work on this myself
